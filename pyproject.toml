[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laika-wound-ai"
version = "0.1.0"
description = "Training pipeline for wound and burn detection/classification with Ultralytics YOLO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kagglehub>=0.3.12",
  "pillow>=10.0.0",
  "pyyaml>=6.0.1",
  "scikit-learn>=1.4.0",
  "ultralytics>=8.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
laika-prepare = "laika_wounds.prepare:main"
laika-train = "laika_wounds.train:main"
laika-predict = "laika_wounds.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
