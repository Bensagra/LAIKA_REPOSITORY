[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laika"
version = "0.1.0"
description = "Local web controller for Unitree Go2 (WebRTC)"
requires-python = ">=3.10"
dependencies = [
    "unitree_webrtc_connect>=0.5.0",
    "aiohttp>=3.9.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
laika = "laika.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laika = ["static/*.html"]
